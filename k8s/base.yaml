apiVersion: v1
kind: Namespace
metadata:
  name: trace-lab
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: payment-config
  namespace: trace-lab
data:
  mode: normal
---
apiVersion: v1
kind: Secret
metadata:
  name: payment-secret
  namespace: trace-lab
type: Opaque
stringData:
  value: lab-payment-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: trace-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      containers:
      - name: customer-service
        image: incident-lab:v5
        imagePullPolicy: IfNotPresent
        command: ["python","/app/service.py"]
        ports:
        - containerPort: 8080
        env:
        - name: SERVICE_NAME
          value: customer-service
        - name: FAILURE_MODE
          value: none
        - name: NEXT_URL
          value: http://session-service:8080/process
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 1
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: trace-lab
spec:
  selector:
    app: customer-service
  ports:
  - port: 8080
    targetPort: 8080

---
