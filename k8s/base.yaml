  name: payment-service
  namespace: trace-lab
spec:
  selector:
    app: payment-service
  ports:
  - port: 8080
    targetPort: 8080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic-generator
  namespace: trace-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic-generator
  template:
    metadata:
      labels:
        app: traffic-generator
    spec:
      containers:
      - name: traffic-generator
        image: incident-lab:v5
        imagePullPolicy: IfNotPresent
        command: ["python","/app/traffic.py"]
        env:
        - name: CUSTOMER_URL
          value: http://customer-service:8080/process
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
