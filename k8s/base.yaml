---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: trace-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-service
        image: incident-lab:v5
        imagePullPolicy: IfNotPresent
        command: ["python","/app/service.py"]
        ports:
        - containerPort: 8080
        env:
        - name: SERVICE_NAME
          value: payment-service
        - name: FAILURE_MODE
          value: none
        - name: LAB_SECRET
          valueFrom:
            secretKeyRef:
              name: payment-secret
              key: value
        - name: LAB_CONFIG
          valueFrom:
            configMapKeyRef:
              name: payment-config
              key: mode
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 1
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 3
          periodSeconds: 5
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
